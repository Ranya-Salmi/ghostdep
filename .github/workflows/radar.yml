name: GhostDep Radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Scan newest PyPI packages
        run: |
          mkdir -p radar
          echo "=== $(date -u +%Y-%m-%dT%H:%MZ) ===" >> radar/log.txt
          ghostdep scan-new >> radar/log.txt 2>&1 || true
      - name: Commit results
        run: |
          git config user.name "ghostdep-radar"
          git config user.email "radar@users.noreply.github.com"
          git add radar/log.txt
          git commit -m "Radar scan $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git push