name: GhostDep Radar

on:
  schedule:
    # Offset from the top of the hour, when GitHub's scheduler is busiest.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghostdep-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Sweep newest PyPI packages
        run: python scripts/radar_update.py
      - name: Commit results
        run: |
          git config user.name "ghostdep-radar"
          git config user.email "radar@users.noreply.github.com"
          git add radar/ docs/radar.json
          git commit -m "Radar sweep $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "No changes"; exit 0; }
          git pull --rebase
          git push
