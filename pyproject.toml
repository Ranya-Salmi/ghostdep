[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostdep"
version = "0.1.0"
description = "Security guard that stops AI coding agents from installing hallucinated, typosquatted, or vulnerable packages."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
    "httpx>=0.27.0",
    "diskcache>=5.6.0",
    "click>=8.1.0",
    "rapidfuzz>=3.9.0",
]

[project.scripts]
ghostdep = "ghostdep.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["ghostdep"]
